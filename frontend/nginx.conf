# Rendered by the official nginx image at start-up (envsubst on /etc/nginx/templates/*.template).
# Only variables present in the environment are substituted: BACKEND_UPSTREAM, NGINX_PORT.
#   docker compose: BACKEND_UPSTREAM=http://backend:8080     cloud: BACKEND_UPSTREAM=https://<api-host>
# Preserve the scheme seen by an edge proxy in front of nginx (Cloudflare Tunnel, Caddy) so the backend
# recognises same-origin browser requests (CORS) and builds correct absolute URLs.
map $http_x_forwarded_proto $nexus_fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}
map $nexus_fwd_proto $nexus_fwd_port {
    https   443;
    default $server_port;
}

server {
    listen ${NGINX_PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 2m;

    # Visitors reaching an edge proxy (Cloudflare Tunnel) over plain HTTP are sent to HTTPS.
    # Direct local access (no X-Forwarded-Proto header) is not affected.
    if ($http_x_forwarded_proto = "http") {
        return 308 https://$host$request_uri;
    }

    # API, OpenAPI document and Swagger UI are served by the Spring Boot backend
    location ~ ^/(api/|v3/api-docs|swagger-ui) {
        proxy_pass ${BACKEND_UPSTREAM};
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $nexus_fwd_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $nexus_fwd_proto;
        proxy_read_timeout 120s;
    }

    location = /swagger-ui.html {
        proxy_pass ${BACKEND_UPSTREAM};
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $nexus_fwd_proto;
    }

    # public API health check (status only – details are disabled in the backend)
    location = /actuator/health {
        proxy_pass ${BACKEND_UPSTREAM};
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
    }

    # liveness for platform health checks (no backend dependency)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store";
        try_files $uri /index.html;
    }
}
