spring:
  datasource:
    url: jdbc:h2:mem:nexus;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

logging:
  level:
    com.nexus.nfv: WARN
    org.hibernate.SQL: WARN

nexus:
  scheduling:
    enabled: false
  security:
    jwt-secret: test-only-jwt-secret-0123456789-abcdefghijklmnop
    # Test-only fixture: base64 of "0123456789abcdef0123456789abcdef" for the H2 test context. Real deployments
    # must supply their own NEXUS_CREDENTIAL_KEY through the environment.
    credential-key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY= # gitleaks:allow
    bootstrap:
      admin-username: admin
      admin-password: Adm1n!TestPass
      demo-users-password: Dem0!UserPass
  agent:
    token: test-agent-token-0123456789
    connect-timeout-ms: 1000
    read-timeout-ms: 2000
  orchestrator:
    mode: docker
    docker:
      api-url: http://127.0.0.1:1
  onos:
    mode: demo
