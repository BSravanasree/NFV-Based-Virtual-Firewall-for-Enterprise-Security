# Continuous integration: builds and tests the control plane and the console.
# No secrets, no deployment. The privileged firewall lab (NET_ADMIN, nftables, Docker networks) is exercised by
# lab/e2e_test.py on a real Docker host, not on GitHub-hosted runners.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4 detect --source /repo --redact --no-banner -v

  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit and integration tests (JUnit, Mockito, MockMvc on H2/MySQL mode)
        run: mvn -B -ntp test
      - name: Package
        run: mvn -B -ntp -DskipTests package
      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports
          if-no-files-found: ignore

  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Type check
        run: npx tsc -b --noEmit
      - name: Component and unit tests (Vitest + Testing Library)
        run: npm test
      - name: Production build
        run: npm run build

  vnf-agent:
    name: Firewall VNF agent & scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax (agent, lab tooling)
        run: python3 -m py_compile vnf-firewall/agent/nexus_agent.py lab/e2e_test.py lab/security_audit.py lab/sdn/nexus_topology.py
      - name: ShellCheck deployment scripts
        run: shellcheck -S warning deploy/deploy-ubuntu.sh vnf-firewall/entrypoint.sh vnf-firewall/netconf/init-netconf.sh lab/node/lab-node.sh lab/verify-traffic.sh
      - name: Compose files are valid
        run: |
          cp .env.example .env
          sed -i 's/^NEXUS_ADMIN_PASSWORD=.*/NEXUS_ADMIN_PASSWORD=Ci-Only-Placeholder-1!/; s/^NEXUS_CREDENTIAL_KEY=.*/NEXUS_CREDENTIAL_KEY=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=/' .env
          docker compose --profile lab config -q
          PUBLIC_HOST=ci.example.invalid docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml --profile lab config -q
