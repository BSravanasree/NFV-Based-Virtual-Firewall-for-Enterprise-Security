# ulogd2: NFLOG group 1 (nftables "log group 1") -> JSON lines consumed by the NEXUS agent.
# Only packet headers are decoded (BASE); no payload is stored.
[global]
logfile="/var/log/ulog/ulogd.log"
loglevel=3
plugin="/usr/lib/x86_64-linux-gnu/ulogd/ulogd_inppkt_NFLOG.so"
plugin="/usr/lib/x86_64-linux-gnu/ulogd/ulogd_raw2packet_BASE.so"
plugin="/usr/lib/x86_64-linux-gnu/ulogd/ulogd_filter_IFINDEX.so"
plugin="/usr/lib/x86_64-linux-gnu/ulogd/ulogd_filter_IP2STR.so"
plugin="/usr/lib/x86_64-linux-gnu/ulogd/ulogd_output_JSON.so"

stack=log1:NFLOG,base1:BASE,ifi1:IFINDEX,ip2str1:IP2STR,json1:JSON

[log1]
group=1
# copy only the headers needed for decoding
copy_range=128

[json1]
sync=1
file="/var/log/ulog/nexus-events.json"
